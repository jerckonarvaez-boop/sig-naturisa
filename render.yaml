# Configuración de despliegue en Render (https://render.com) — "Blueprint".
# Render crea el servicio a partir de este archivo y lo vuelve a desplegar en cada push a "main".
services:
  - type: web
    name: sig-naturisa
    runtime: node
    # Plan gratuito: se duerme sin uso (ver .github/workflows/mantener-activa.yml) y su disco se
    # borra al reiniciar; por eso los datos se guardan en Turso (TURSO_DATABASE_URL/TOKEN).
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Servicio corporativo que valida usuario y contraseña de Naturisa
      - key: AUTH_URL
        value: https://gateway.naturisa.com.ec/bff/web/portal/security/api/auth
      # Clave aleatoria para firmar las sesiones (Render la genera automáticamente)
      - key: SESSION_SECRET
        generateValue: true
      # Base de datos en la nube (Turso): los datos ya no se pierden al dormirse o publicar.
      # El token se escribe a mano en el panel de Render (Environment); nunca se sube a GitHub.
      - key: TURSO_DATABASE_URL
        value: libsql://sig-naturisa-jerckonarvaez-boop.aws-us-west-2.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Clave de los datos iniciales cifrados (server/semillas). Se escribe a mano en el panel de
      # Render (Environment), igual a SEMILLA_CLAVE de server/.env; nunca se sube a GitHub.
      - key: SEMILLA_CLAVE
        sync: false
      # - key: DB_PATH
      #   value: /var/data/sig.db
