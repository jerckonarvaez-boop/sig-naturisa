<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIG · Naturisa</title>

    <!-- App instalable (PWA): ícono y apariencia al agregarla a la pantalla de inicio -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f2a44" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SIG Naturisa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <script>
      // Aplica el tema guardado antes de pintar, para evitar parpadeo
      try {
        if (localStorage.getItem('sig-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
